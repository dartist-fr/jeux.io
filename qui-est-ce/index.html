<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    
    <title>Qui est-ce ? (Version Grinçante) — Salle d'Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0616;
            --card-bg: #140a26;
            --grid-line: rgba(255, 46, 136, 0.10);
            --border-color: rgba(255, 46, 136, 0.35);
            --text-main: #f3e9ff;
            --text-sub: #9d8bc4;
            --accent: #ff2e88;
            --neon-green: #4dffa6;
            --neon-cyan: #22e6ff;
            --font-display: 'Press Start 2P', monospace;
            --font-body: 'VT323', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg-color); }
        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
                radial-gradient(circle at 50% 0%, rgba(255, 46, 136, 0.15) 0%, transparent 55%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px 60px;
            position: relative;
            font-size: 1.2rem;
        }

        /* L'effet de balayage rétro de la page */
        body::after {
            content: "";
            position: fixed; inset: 0; pointer-events: none;
            background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px);
            z-index: 100; mix-blend-mode: multiply;
        }

        .top-bar { max-width: 900px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn-back, .btn-fs {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: var(--font-display); font-size: 0.5rem;
            color: var(--accent); text-decoration: none;
            padding: 10px 14px; border: 2px solid var(--accent);
            background: rgba(255, 46, 136, 0.06); cursor: pointer;
            box-shadow: 0 0 0 2px var(--bg-color), 4px 4px 0 rgba(255, 46, 136, 0.35);
        }

        .container {
            max-width: 900px; margin: 0 auto;
            background: var(--card-bg); border: 2px solid var(--accent);
            padding: 24px 20px;
            box-shadow: 0 0 0 4px var(--bg-color), 8px 8px 0 rgba(0,0,0,0.6), 0 0 30px rgba(255,46,136,0.25);
            position: relative; z-index: 10;
            text-align: center;
        }

        h1 {
            font-family: var(--font-display); font-size: 1.1rem; line-height: 1.4;
            color: var(--accent); text-shadow: 0 0 8px rgba(255,46,136,0.9), 3px 3px 0 #4a0d2b;
            margin-bottom: 8px;
        }

        .phase-subtitle { font-size: 1.15rem; color: var(--text-sub); margin-bottom: 20px; }

        .panel { background: rgba(0,0,0,0.35); border: 2px solid var(--border-color); padding: 18px; margin-bottom: 16px; text-align: center; }

        .grille-persos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .carte-perso {
            background: #07040f;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            padding: 10px 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 160px;
            position: relative;
        }

        .carte-perso:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .carte-perso.eliminee {
            opacity: 0.3;
            filter: grayscale(1);
            border-color: #333;
            background: #030207;
        }
        .carte-perso.eliminee .nom {
            text-decoration: line-through;
        }

        /* Cadre rond et propre pour les photos, positionné au-dessus des lignes de balayage */
        .avatar-container {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            overflow: hidden;
            background: #110822;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 101; /* Passe au-dessus du filtre de lignes de la page */
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carte-perso .nom {
            font-family: var(--font-display);
            font-size: 0.5rem;
            color: #fff;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .carte-perso .tag {
            font-size: 0.75rem;
            color: var(--text-sub);
            line-height: 1.1;
        }

        .btn-action {
            display: inline-flex; align-items: center; justify-content: center;
            width: 100%; max-width: 300px; padding: 14px; font-family: var(--font-display); font-size: 0.6rem;
            background: var(--accent); color: #000; border: none; cursor: pointer;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.6); margin: 10px auto; font-weight: bold;
        }
        .btn-secondary { background: rgba(255, 46, 136, 0.1); border: 2px solid var(--accent); color: var(--text-main); }

        .info-secret {
            font-family: var(--font-display);
            font-size: 0.65rem;
            color: var(--neon-cyan);
            background: rgba(34, 230, 255, 0.05);
            border: 1px dashed var(--neon-cyan);
            padding: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="../" class="btn-back">&lsaquo; HUB</a>
        <button type="button" id="btn-fullscreen" class="btn-fs">PLEIN ÉCRAN</button>
    </div>

    <main class="container" id="app"></main>

    <script>
        const PERSONNAGES = [
            { nom: "Pape François", desc: "Le boss du Vatican", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTSiH8vs2GVJ0mNoEDj6BDw8akqYw3BbN4VfgAB2LeHjT30AUaiyC8YsNK7pisAQN8sYCl81eXzlMOK0Zw_u4Of-H0SnnuL3_vjj0ngNPv1&s=10" },
            { nom: "Vladimir Poutine", desc: "Torse nu l'hiver", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTU5QyiZueyJUtXq6cL_v830DDI-Pplz_CHukFnRFVc1iBT5gaKH2PkqAb7JxqzC4garFI2IXqJl9m8PNJe9x8ceUGTWqEL_n9bXp8kkyqq&s=10" },
            { nom: "Kim Jong-un", desc: "Coupe iconique", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFIvh6YWhuGeMHcHXpi1Q_ifCOOwq6LBazMuGNAtNRKaQgifZY8qkvJKJ44t7AbufY1zZVv0mUhEB4GlDG4nQ-0XQn4-u2F9_qR0ydsoYz&s=10" },
            { nom: "Donald Trump", desc: "Bronzage orange", img: "https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcSTN8Vf-kDjwTXQLHyB8pEUJARHOEI0xjcQ0O_1YfEPHO0X97CjMO4RB4g-VuFV07Fz_D6mOqbhXVRXGC5jwrfP-ZYtFlRU&s=19" },
            { nom: "Emmanuel Macron", desc: "Fan de couteaux-tirs", img: "https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcQ1zb_Z3FCmJwmEWSc-b7jqT8ERj3wWkFY1v-al0SDGsP8zHlRnoVSrX1MswvWc2fWd1h_YkT75vtAUvQzuzBlM2N867Ws&s=19" },
            { nom: "Mick Jagger", desc: "Survivra à tout", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRW-Jj5mm_G7ds6DbEder5m0iWi8dmhxtAlSH6aIsgH4J9DKC4S9dGt8s-72BBMbENhj461513FYJDBiPZJ9bzPyBbXV97N&s=10" },
            { nom: "Kanye West", desc: "Génie incompris", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDevyJUyasM7oSxQuhnmNfyfeHL5vUzChJv4zB7KSch9RCHvcZwJ6EGXrrqR66zNVFbsoEpBFYxhmj2WcqxhXSvRqklPk&s=10" },
            { nom: "Saddam Hussein", desc: "Fan de cache-cache", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQUimeA6SvsQxflOgYMH8bFaAZ8Uo6fWUtD74Irb90wbA&s=10" },
            { nom: "Gérard Depardieu", desc: "Bons crus russes", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRbN6BXOxItdO5qngzSk0i9TtHRP27apjFFc3GJWf1DPNMXSQv7FBre0qiqBIHF-IIXMksO0NJFRPral4N0u-iJNkFc9-MARZvSIafmq5UpfA&s=10" },
            { nom: "Johnny Hallyday", desc: "Toujours là", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSkQN1qLR37QoYTmvWkqXbWc07QaEdc3RjWTrwcs1mdVD0wXWw8vRfnf47JBoQHEGHL8jmuFqU1PJlJYXYtCZl-LNtjBMGe&s=10" },
            { nom: "Balkany", desc: "Résident en cellule", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRFax0rte650ewMC3Eh9B86_fyzfrCSzoGeE2neCaZNzINsYxmkRRKZqnHmJA74kuIfZV8F61OVLzpCMJsqjhvOHFISa1BG&s=10" },
            { nom: "Karl Lagerfeld", desc: "Lunettes indoor", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ0LoLp2KncYSW7TsFM_KaC7Hgr_SYv_28GyGOFkEqGFfrgSeT3lnUyAkV1fdsF8o9vYfjrhDRkhcZf6FeJrCGSB5T9hT5D&s=10" },
            { nom: "Michael Jackson", desc: "Maître du moonwalk", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-sWqcaV5Y6rFls2G-d0Uxl0fGwpsWXV0Ase5mEG6_dup5KZn8mu9CT1Ct4pbWaXYaXT1qAMgtx6O4w3CRRa2RQ0vkDfc&s=10" },
            { nom: "Elizabeth II", desc: "Immortelle (ex)", img: "https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcTKuXE1_OCVEEQ6VRzQv0N3FNF2IP14lDt7y05ZZoa0C87ulu_lU21VrrBGxIuJupOq3S9MfWXT2M87yy0Yr6QIXlhi883L&s=19" },
            { nom: "Dieudonné", desc: "Polémique pro", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSJaq6ANN9xJF4dhV93ls8lFhITSCjDqQss88VOkysBcL-2YgThW3Y-j2-tiMNWTEFiEQG0hzFyAXNHQ9ANUeVzN4TLstQ&s=10" },
        ];

        let state = {
            screen: "setup", 
            personnagesActifs: []
        };

        function demarrerPartie() {
            state.personnagesActifs = PERSONNAGES.map(p => ({ ...p, elimine: false }));
            state.screen = "jeu";
            render();
        }

        function basculerElimination(index) {
            state.personnagesActifs[index].elimine = !state.personnagesActifs[index].elimine;
            render();
        }

        function render() {
            const app = document.getElementById("app");

            if (state.screen === "setup") {
                app.innerHTML = `
                    <h1>QUI EST-CE ?</h1>
                    <p class="phase-subtitle">Édition Spéciale : Personnalités & Humour Noir</p>
                    <div class="panel">
                        <p style="font-size:1.1rem; color:var(--text-sub); margin-bottom:20px; line-height:1.4;">
                            Règle : Chaque joueur choisit secrètement une personnalité de la grille. À tour de rôle, posez des questions fermées pour éliminer les suspects en cliquant sur leurs cartes !
                        </p>
                        <button class="btn-action" onclick="demarrerPartie()">Lancer la partie 🚀</button>
                    </div>
                `;
            }
            else if (state.screen === "jeu") {
                let grilleHtml = state.personnagesActifs.map((p, index) => {
                    return `
                        <div class="carte-perso ${p.elimine ? 'eliminee' : ''}" onclick="basculerElimination(${index})">
                            <div class="avatar-container">
                                <img src="${p.img}" alt="${p.nom}">
                            </div>
                            <div class="nom">${p.nom}</div>
                            <div class="tag">${p.desc}</div>
                        </div>
                    `;
                }).join("");

                app.innerHTML = `
                    <h1>PLATEAU DE JEU</h1>
                    <p class="phase-subtitle">Clique sur une carte pour l'éliminer / la griser</p>
                    
                    <div class="info-secret">
                        💡 Astuce : Pose tes questions à l'oral à tes potes, et éliminez les suspects au fur et à mesure !
                    </div>

                    <div class="grille-persos">
                        ${grilleHtml}
                    </div>

                    <button class="btn-action btn-secondary" onclick="demarrerPartie()">Réinitialiser le plateau ⟳</button>
                `;
            }
        }

        document.getElementById('btn-fullscreen').addEventListener('click', function () {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                this.textContent = "QUITTER";
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                this.textContent = "PLEIN ÉCRAN";
            }
        });

        render();
    </script>
</body>
</html>
