  .row span.label{font-size:14px;color:var(--dim);}

function migrateLibrary(){
  var currentVersion = "undercover_library_v3";
  var stored = null;
  try{ var raw = localStorage.getItem(currentVersion); if(raw) stored = JSON.parse(raw); }catch(e){}
  if(stored && stored.length){ state.library = stored; return; }
  
  var customPairs = [];
  try{
    var oldKeys = ["undercover_library", "undercover_library_v2", "undercover_custom_pairs"];
    oldKeys.forEach(function(key){
      var oldRaw = localStorage.getItem(key);
      if(oldRaw){
        var parsed = JSON.parse(oldRaw);
        parsed.forEach(function(p){
          if(p.id && String(p.id).indexOf("c") === 0){
            var exists = customPairs.some(function(cp){ return cp.civil === p.civil && cp.undercover === p.undercover; });
            if(!exists) customPairs.push(p);
          }
        });
      }
    });
  }catch(e){}

  var lib = BUILTIN_PAIRS.map(function(p,i){ return { id:"b"+i, theme:p.theme, difficulty:p.difficulty, civil:p.civil, undercover:p.undercover }; });
  customPairs.forEach(function(p){ lib.push(p); });
  state.library = lib;
  saveLibrary();
}

function saveLibrary(){ try{ localStorage.setItem("undercover_library_v3", JSON.stringify(state.library)); }catch(e){} }

function loadStorage(){
  migrateLibrary();
  try{ var gh = localStorage.getItem("undercover_game_history"); if(gh) state.gameHistory = JSON.parse(gh); }catch(e){}
  try{ var tm = localStorage.getItem("undercover_theme"); if(tm==="light"||tm==="dark") state.themeMode = tm; }catch(e){}
  applyTheme();
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", state.themeMode);
}
function toggleTheme(){
  state.themeMode = state.themeMode==="dark" ? "light" : "dark";
  try{ localStorage.setItem("undercover_theme", state.themeMode); }catch(e){}
  applyTheme();
  render();
}
function toggleFullscreen(){
  var isFs = document.fullscreenElement || document.webkitFullscreenElement;
  if(!isFs){
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(req){ try{ req.call(el); }catch(e){} }
  } else {
    var exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if(exit){ try{ exit.call(document); }catch(e){} }
  }
}
document.addEventListener("fullscreenchange", function(){ render(); });
document.addEventListener("webkitfullscreenchange", function(){ render(); });
function saveGameHistory(){ try{ localStorage.setItem("undercover_game_history", JSON.stringify(state.gameHistory.slice(0,30))); }catch(e){} }

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function allPairs(){ return state.library; }
function themesList(){
  var set = {}; allPairs().forEach(function(p){ set[p.theme]=true; });
  return ["Aléatoire"].concat(Object.keys(set).sort());
}

function addPlayer(){
  var input = document.getElementById("nameInput");
  var name = input.value.trim();
  if(!name) return;
  state.playerNames.push(name);
  render();
}
function removePlayer(idx){ state.playerNames.splice(idx,1); render(); }

function changeUndercover(delta){
  state.numUndercover = Math.max(0, Math.min(3, state.numUndercover+delta)); render();
}
function changeWhite(delta){
  state.numWhite = Math.max(0, Math.min(2, state.numWhite+delta)); render();
}
function setTheme(v){ state.theme=v; }
function setDifficulty(v){ state.difficulty=v; }

function toggleGameMaster(){
  state.isGameMaster = !state.isGameMaster;

function startGame(){
  var pair = null;

  // Récupération des choix si le mode Game Master est actif
  if(state.isGameMaster){
    var gmCiv = document.getElementById("gmCivil");
    var gmUnd = document.getElementById("gmUndercover");
    if(gmCiv) state.customCivil = gmCiv.value.trim();
    if(gmUnd) state.customUndercover = gmUnd.value.trim();

    if(!state.customCivil || !state.customUndercover){
      alert("Veuillez renseigner les deux mots pour le mode Game Master.");
      return;
    }
    pair = { theme:"Personnalisé", difficulty:"Custom", civil:state.customCivil, undercover:state.customUndercover };
  } else {
    var themeSel = document.getElementById("themeSel");
    var diffSel = document.getElementById("diffSel");
    if(themeSel) state.theme = themeSel.value;
    if(diffSel) state.difficulty = diffSel.value;

    var pool = allPairs();
    if(state.theme !== "Aléatoire") pool = pool.filter(function(p){return p.theme===state.theme;});
    if(state.difficulty !== "Aléatoire") pool = pool.filter(function(p){return p.difficulty===state.difficulty;});
    if(pool.length===0) pool = allPairs();
    pair = pool[Math.floor(Math.random()*pool.length)];
  }

  var order = shuffle(state.playerNames.map(function(_,i){return i;}));
  var players = state.playerNames.map(function(name,idx){
    return { id:idx, name:name, role:"civil", word:pair.civil, alive:true };
  });
  order.slice(0,state.numUndercover).forEach(function(idx){ players[idx].role="undercover"; players[idx].word=pair.undercover; });
  order.slice(state.numUndercover, state.numUndercover+state.numWhite).forEach(function(idx){ players[idx].role="white"; players[idx].word=null; });

  state.players = players;
  state.wordPair = pair;
  state.revealIndex = 0;
  state.revealed = false;
  state.round = 1;
  state.eliminations = [];
  state.winner = null;
  state.clueOrder = shuffle(players.map(function(p){return p.id;}));
  state.clueTurn = 0;
  state.screen = "reveal";
  render();
}

function revealCard(){ state.revealed = true; render(); }
function nextReveal(){
  if(state.revealIndex+1 >= state.players.length){ state.screen="clues"; }
  else { state.revealIndex++; state.revealed=false; }
  render();
}

function aliveClueOrder(){
  return state.clueOrder.filter(function(id){
    var p = state.players.find(function(pl){return pl.id===id;});
    return p && p.alive;
  });
}
function nextClueTurn(){
  var order = aliveClueOrder();
  if(state.clueTurn+1 >= order.length){ state.screen="vote"; state.selectedVote=null; }
  else { state.clueTurn++; }
  render();
}
function goToVote(){ state.screen="vote"; state.selectedVote=null; render(); }
function selectVote(id){ state.selectedVote = id; render(); }

function confirmVote(){
  if(state.selectedVote==null) return;
  var target = state.players.find(function(p){return p.id===state.selectedVote;});
  state.justEliminated = target;
  target.alive = false;
  state.eliminations.push({ round:state.round, playerId:target.id, name:target.name, role:target.role });
  if(target.role==="white"){
    state.screen="whiteGuess";
  } else {
    state.screen="eliminationReveal";
  }
  render();
}

function submitWhiteGuess(){
  var input = document.getElementById("whiteGuessInput");
  var guess = (input ? input.value : "").trim();
  var correct = guess.length>0 && guess.toLowerCase()===state.wordPair.civil.trim().toLowerCase();
  var last = state.eliminations[state.eliminations.length-1];
  last.whiteGuess = guess;
  last.whiteCorrect = correct;
  if(correct){ finishGame("white"); }
  else { state.screen="eliminationReveal"; render(); }
}

function checkWinCondition(){
  var alive = state.players.filter(function(p){return p.alive;});
  var aliveInf = alive.filter(function(p){return p.role!=="civil";}).length;
  var aliveCiv = alive.filter(function(p){return p.role==="civil";}).length;
  if(aliveInf===0) return "civils";
  if(aliveInf>=aliveCiv) return "infiltrators";
  return null;
}
function proceedAfterElimination(){
  var result = checkWinCondition();
  if(result){ finishGame(result); return; }
  state.round++;
  var aliveIds = state.players.filter(function(p){return p.alive;}).map(function(p){return p.id;});
  state.clueOrder = shuffle(aliveIds);
  state.clueTurn = 0;
  state.screen = "clues";
  render();
}

function finishGame(winnerKey){
  state.winner = winnerKey;
  state.screen = "end";
  state.gameHistory.unshift({
    date:new Date().toISOString(),
    winner:winnerKey,
    players: state.players.map(function(p){return {name:p.name, role:p.role};}),
    rounds: state.round,
    wordPair: state.wordPair,
    eliminations: state.eliminations
  });
  saveGameHistory();
  render();
}

function newGameSamePlayers(){ state.screen="setup"; render(); }

function openLibrary(){ state.showLibrary=true; render(); }
function closeLibrary(){ state.showLibrary=false; render(); }
function openStats(){ state.showStats=true; render(); }
function closeStats(){ state.showStats=false; render(); }

function addLibraryPair(){
  var civil = document.getElementById("wmCivil").value.trim();
  var undercover = document.getElementById("wmUndercover").value.trim();
  var theme = document.getElementById("wmTheme").value.trim();
  var diff = document.getElementById("wmDiff").value;
  if(!civil || !undercover || !theme) return;
  state.library.push({ id:"c"+Date.now()+"_"+Math.floor(Math.random()*1000), theme:theme, difficulty:diff, civil:civil, undercover:undercover });
  saveLibrary();
  render();
}
function deleteLibraryPair(id){
  state.library = state.library.filter(function(p){ return p.id!==id; });
  saveLibrary();
  render();
}
function moveLibraryPair(id, newTheme){
  var p = state.library.find(function(pl){ return pl.id===id; });
  if(p){ p.theme = newTheme; saveLibrary(); }
  render();
}

// ============ RENDER ============

function render(){
  var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  var html = "";
  html += '<header><div><h1 class="display">UNDERCOVER</h1><div class="subtitle">DOSSIER CONFIDENTIEL — JEU DE DÉDUCTION</div></div>';
  html += '<div class="headerbtns">';
  if(state.screen==="setup" && !state.showLibrary && !state.showStats){
    html += '<button class="iconbtn" onclick="openLibrary()" aria-label="Bibliothèque">&#128214;</button>';
    html += '<button class="iconbtn" onclick="openStats()" aria-label="Historique">&#8635;</button>';
  }
  html += '<button class="themebtn" onclick="toggleTheme()">'+(state.themeMode==="dark" ? "&#9728; Clair" : "&#9789; Sombre")+'</button>';
  html += '<button class="themebtn" onclick="toggleFullscreen()">'+(isFs ? "&#10005; Quitter" : "&#9974; Plein écran")+'</button>';
  html += '</div></header>';

  if(state.showLibrary){ html += renderLibrary(); }
  else if(state.showStats){ html += renderStats(); }
  else if(state.screen==="setup"){ html += renderSetup(); }
  else if(state.screen==="reveal"){ html += renderReveal(); }
  else if(state.screen==="clues"){ html += renderClues(); }
  else if(state.screen==="vote"){ html += renderVote(); }
  else if(state.screen==="whiteGuess"){ html += renderWhiteGuess(); }
  else if(state.screen==="eliminationReveal"){ html += renderEliminationReveal(); }
  else if(state.screen==="end"){ html += renderEnd(); }

  document.getElementById("app").innerHTML = html;
  var ni = document.getElementById("nameInput");
  if(ni){ ni.addEventListener("keydown", function(e){ if(e.key==="Enter") addPlayer(); }); ni.focus({preventScroll:true}); }
  var wg = document.getElementById("whiteGuessInput");
  if(wg){ wg.addEventListener("keydown", function(e){ if(e.key==="Enter") submitWhiteGuess(); }); wg.focus({preventScroll:true}); }
}

function renderSetup(){
  var n = state.playerNames.length;
  var numCivils = n - state.numUndercover - state.numWhite;
  var tooMany = (state.numUndercover+state.numWhite) >= numCivils || numCivils<1;
  var canStart = n>=3 && !tooMany;

  var chips = state.playerNames.map(function(name,idx){
    return '<div class="chip"><span>'+esc(name)+'</span><button onclick="removePlayer('+idx+')">&#10005;</button></div>';
  }).join("");

  var themes = themesList();
  var themeOpts = themes.map(function(t){ return '<option value="'+esc(t)+'"'+(t===state.theme?" selected":"")+'>'+esc(t)+'</option>'; }).join("");
  var diffs = ["Aléatoire","facile","moyen","difficile"];
  var diffOpts = diffs.map(function(d){ return '<option value="'+d+'"'+(d===state.difficulty?" selected":"")+'>'+d+'</option>'; }).join("");

  var html = "";
  html += '<div class="panel"><h2>Joueurs ('+n+')</h2><div class="chips">'+chips+'</div>';
  html += '<div class="inline2"><input type="text" id="nameInput" placeholder="Nom du joueur"><button class="btn btn-ghost btn-small" onclick="addPlayer()">+</button></div></div>';

  html += '<div class="panel"><h2>Infiltrés</h2>';
  html += '<div class="row"><span class="label">Undercover</span><div class="stepper"><button onclick="changeUndercover(-1)">−</button><span class="val mono">'+state.numUndercover+'</span><button onclick="changeUndercover(1)">+</button></div></div>';
  html += '<div class="row"><span class="label">Mr. White</span><div class="stepper"><button onclick="changeWhite(-1)">−</button><span class="val mono">'+state.numWhite+'</span><button onclick="changeWhite(1)">+</button></div></div>';
  html += '<div class="mono dim" style="font-size:12px;border-top:1px solid var(--border);padding-top:8px;margin-top:6px;">'+numCivils+' civil'+(numCivils>1?"s":"")+' · '+state.numUndercover+' undercover · '+state.numWhite+' mr. white</div>';
  if(tooMany) html += '<div class="warn">Trop d\'infiltrés pour '+n+' joueurs — les civils doivent rester majoritaires.</div>';
  html += '</div>';

  // --- SECTION MOTS SECRETS & MODE GAME MASTER ---
  html += '<div class="panel">';
  html += '<div class="toprow mb10"><h2>Mots secrets</h2>';
  html += '<label style="font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;" class="dim mono">';
  html += '<input type="checkbox" '+(state.isGameMaster?"checked":"")+' onchange="toggleGameMaster()"> Mode Game Master';
  html += '</label></div>';

  if(state.isGameMaster){
    html += '<p class="dim" style="font-size:12px;margin:0 0 10px;">Définissez manuellement les mots pour cette partie :</p>';
    html += '<div class="grid2">';
    html += '<div><span class="fieldlabel">Mot des Civils</span><input type="text" id="gmCivil" value="'+esc(state.customCivil)+'" placeholder="ex: Soleil" oninput="state.customCivil=this.value"></div>';
    html += '<div><span class="fieldlabel">Mot des Undercovers</span><input type="text" id="gmUndercover" value="'+esc(state.customUndercover)+'" placeholder="ex: Lune" oninput="state.customUndercover=this.value"></div>';
    html += '</div>';
  } else {
    html += '<div class="grid2">';
    html += '<div><span class="fieldlabel">Thème</span><select id="themeSel" onchange="setTheme(this.value)">'+themeOpts+'</select></div>';
    html += '<div><span class="fieldlabel">Difficulté</span><select id="diffSel" onchange="setDifficulty(this.value)">'+diffOpts+'</select></div>';
    html += '</div><button class="linkbtn" onclick="openLibrary()">Gérer la bibliothèque de mots ('+state.library.length+')</button>';
  }
  html += '</div>';

  html += '<button class="btn btn-primary" '+(canStart?"":"disabled")+' onclick="startGame()">Lancer la partie &#8594;</button>';
  if(n<3) html += '<p class="dim center" style="font-size:12px;">Ajoutez au moins 3 joueurs.</p>';
  return html;
}

function renderReveal(){
  var p = state.players[state.revealIndex];
  var html = '<p class="center mono dim" style="font-size:12px;">JOUEUR '+(state.revealIndex+1)+' / '+state.players.length+'</p>';
  html += '<div class="panel center py-lg">';
  if(!state.revealed){
    html += '<p class="dim" style="font-size:14px;">Passez l\'appareil à</p>';
    html += '<p class="display" style="font-size:24px;margin:6px 0 20px;">'+esc(p.name)+'</p>';
    html += '<div class="redacted"><div></div><div></div><div></div><div></div></div>';
    html += '<button class="btn btn-primary" style="width:auto;padding:13px 22px;" onclick="revealCard()">&#128065; Voir mon rôle</button>';
  } else {
    var cls = p.role==="civil" ? "stamp olive" : "stamp";
    html += '<div class="'+cls+'">'+ROLE_LABEL[p.role]+'</div>';
    if(p.role==="white"){
      html += '<p class="dim mt16" style="font-size:14px;max-width:280px;margin-left:auto;margin-right:auto;">Vous n\'avez aucun mot. Écoutez les autres et bluffez pour ne pas être démasqué.</p>';
    } else {
      html += '<p class="dim mt16" style="font-size:12px;">Votre mot</p><p class="wordbig">'+esc(p.word)+'</p>';
    }
    html += '<button class="btn btn-ghost mt24" style="width:auto;padding:11px 20px;" onclick="nextReveal()">J\'ai vu, cacher et passer</button>';
  }
  html += '</div>';
  return html;
}

function renderClues(){
  var order = aliveClueOrder();
  var currentId = order[state.clueTurn];
  var current = state.players.find(function(p){return p.id===currentId;});
  var html = '<div class="toprow"><div class="stamp sm">Round '+state.round+'</div><span class="mono dim" style="font-size:12px;">'+(state.clueTurn+1)+' / '+order.length+'</span></div>';
  html += '<div class="panel center py-lg" style="margin-top:16px;">';
  html += '<p class="dim" style="font-size:14px;">C\'est au tour de</p>';
  html += '<p class="display" style="font-size:24px;margin:4px 0;">'+esc(current.name)+'</p>';
  html += '<p class="dim" style="font-size:12px;margin-bottom:20px;">de donner son indice à voix haute</p>';
  html += '<button class="btn btn-primary" style="width:auto;padding:13px 22px;" onclick="nextClueTurn()">Indice donné &#8250;</button>';
  html += '</div>';
  html += '<div class="flexwrap">';
  order.forEach(function(id,i){
    var p = state.players.find(function(pl){return pl.id===id;});
    var cls = i<state.clueTurn ? "clueChip done" : (i===state.clueTurn ? "clueChip current" : "clueChip");
    html += '<span class="'+cls+'">'+esc(p.name)+'</span>';
  });
  html += '</div>';
  html += '<button class="linkbtn mt16" onclick="goToVote()">Passer directement au vote</button>';
  return html;
}

function renderVote(){
  var alive = state.players.filter(function(p){return p.alive;});
  var html = '<div class="stamp sm">Round '+state.round+' — Vote</div>';
  html += '<p class="dim mt10" style="font-size:14px;">Les joueurs ont débattu et voté à l\'oral. Sélectionnez le joueur éliminé.</p>';
  html += '<div class="mt16">';
  alive.forEach(function(p){
    var sel = state.selectedVote===p.id;
    html += '<button class="voteitem'+(sel?" selected":"")+'" onclick="selectVote('+p.id+')"><span>'+esc(p.name)+'</span>'+(sel?'<span>&#10003;</span>':'')+'</button>';
  });
  html += '</div>';
  html += '<button class="btn btn-primary" '+(state.selectedVote==null?"disabled":"")+' onclick="confirmVote()">&#128128; Confirmer l\'élimination</button>';
  return html;
}

function renderWhiteGuess(){
  var p = state.justEliminated;
  var html = '<div class="panel center py-lg">';
  html += '<div class="stamp md">Mr. White démasqué</div>';
  html += '<p class="mt16" style="font-size:15px;">'+esc(p.name)+', dernière chance :</p>';
  html += '<p class="dim mb10" style="font-size:13px;">devinez le mot des civils pour gagner la partie</p>';
  html += '<input type="text" id="whiteGuessInput" placeholder="Votre réponse" style="text-align:center;">';
  html += '<button class="btn btn-primary mt16" onclick="submitWhiteGuess()">Valider la réponse</button>';
  html += '</div>';
  return html;
}

function renderEliminationReveal(){
  var p = state.justEliminated;
  var last = state.eliminations[state.eliminations.length-1];
  var aliveCiv = state.players.filter(function(pl){return pl.alive && pl.role==="civil";}).length;
  var aliveInf = state.players.filter(function(pl){return pl.alive && pl.role!=="civil";}).length;
  var cls = p.role==="civil" ? "stamp olive" : "stamp";
  var html = '<div class="panel center py-lg">';
  html += '<p class="dim" style="font-size:14px;">'+esc(p.name)+' était</p>';
  html += '<div class="'+cls+'">'+ROLE_LABEL[p.role]+'</div>';
  if(last && last.whiteGuess){
    html += '<p class="dim mt16" style="font-size:13px;">A proposé « '+esc(last.whiteGuess)+' » — '+(last.whiteCorrect?"correct":"incorrect")+'</p>';
  }
  html += '<p class="mono faint mt16" style="font-size:11px;">Restent en vie : '+aliveCiv+' civil'+(aliveCiv>1?"s":"")+', '+aliveInf+' infiltré'+(aliveInf>1?"s":"")+'</p>';
  html += '<button class="btn btn-ghost mt16" style="width:auto;padding:11px 20px;" onclick="proceedAfterElimination()">Continuer</button>';
  html += '</div>';
  return html;
}

function renderEnd(){
  var label = state.winner==="civils" ? "Les Civils gagnent" : (state.winner==="white" ? "Mr. White gagne" : "Les Infiltrés gagnent");
  var cls = state.winner==="civils" ? "stamp olive" : "stamp";
  var html = '<div class="panel center py-lg">';
  html += '<div class="'+cls+'">'+label+'</div>';
  html += '<p class="mono dim mt16" style="font-size:12px;">Partie terminée en '+state.round+' round'+(state.round>1?"s":"")+'</p>';
  html += '</div>';

  html += '<div class="panel"><h2>Mots de la partie</h2><div class="split">';
  html += '<div><p class="dim" style="font-size:12px;">Civils</p><p class="num">'+esc(state.wordPair.civil)+'</p></div>';
  html += '<div><p class="dim" style="font-size:12px;">Undercover</p><p class="num">'+esc(state.wordPair.undercover)+'</p></div>';
  html += '</div></div>';

  html += '<div class="panel"><h2>Récapitulatif</h2>';
  state.players.forEach(function(p){
    html += '<div class="listrow"><span class="'+(p.alive?"":"strike")+'">'+esc(p.name)+'</span><span class="mono dim" style="font-size:12px;">'+ROLE_LABEL[p.role]+'</span></div>';
  });
  if(state.eliminations.length>0){
    html += '<div style="border-top:1px solid var(--border);margin-top:10px;padding-top:8px;">';
    state.eliminations.forEach(function(e){
      html += '<p class="dim" style="font-size:12px;margin:4px 0;">Round '+e.round+' — '+esc(e.name)+' éliminé ('+ROLE_LABEL[e.role]+')</p>';
    });
    html += '</div>';
  }
  html += '</div>';

  html += '<button class="btn btn-primary" onclick="newGameSamePlayers()">&#8635; Nouvelle partie</button>';
  return html;
}

function renderLibrary(){
  var html = '<button class="linkbtn" style="text-align:left;margin:0 0 14px;" onclick="closeLibrary()">&#8249; Retour</button>';
  html += '<div class="panel"><h2>Ajouter un mot</h2>';
  html += '<div class="grid2"><input type="text" id="wmCivil" placeholder="Mot civil"><input type="text" id="wmUndercover" placeholder="Mot undercover"></div>';
  html += '<div class="grid2"><input type="text" id="wmTheme" placeholder="Thème (existant ou nouveau)"><select id="wmDiff"><option value="facile">facile</option><option value="moyen" selected>moyen</option><option value="difficile">difficile</option></select></div>';
  html += '<button class="btn btn-ghost" onclick="addLibraryPair()">+ Ajouter à la bibliothèque</button></div>';

  var groups = {};
  state.library.forEach(function(p){ (groups[p.theme]=groups[p.theme]||[]).push(p); });
  var themeNames = Object.keys(groups).sort();

  html += '<div class="panel"><h2>Bibliothèque ('+state.library.length+' mots)</h2>';
  themeNames.forEach(function(t){
    html += '<p class="mono dim" style="font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin:14px 0 6px;">'+esc(t)+' ('+groups[t].length+')</p>';
    groups[t].forEach(function(p){
      var opts = themeNames.map(function(tn){ return '<option value="'+esc(tn)+'"'+(tn===p.theme?" selected":"")+'>'+esc(tn)+'</option>'; }).join("");
      html += '<div class="libraryrow">';
      html += '<div class="libwords"><span>'+esc(p.civil)+'</span><span class="dim"> / </span><span>'+esc(p.undercover)+'</span><span class="mono faint" style="font-size:10px;display:block;">'+p.difficulty+'</span></div>';
      html += '<div class="libcontrols"><select class="libSelect" onchange="moveLibraryPair(\''+p.id+'\', this.value)">'+opts+'</select><button onclick="deleteLibraryPair(\''+p.id+'\')" aria-label="Supprimer">&#128465;</button></div>';
      html += '</div>';
    });
  });
  html += '</div>';
  return html;
}

function renderStats(){
  var total = state.gameHistory.length;
  var civilWins = state.gameHistory.filter(function(g){return g.winner==="civils";}).length;
  var infWins = total - civilWins;
  var html = '<button class="linkbtn" style="text-align:left;margin:0 0 14px;" onclick="closeStats()">&#8249; Retour</button>';
  html += '<div class="panel"><h2>Statistiques</h2><div class="split">';
  html += '<div><p class="num">'+total+'</p><p class="dim" style="font-size:12px;">parties</p></div>';
  html += '<div><p class="num">'+civilWins+'</p><p class="dim" style="font-size:12px;">civils</p></div>';
  html += '<div><p class="num">'+infWins+'</p><p class="dim" style="font-size:12px;">infiltrés</p></div>';
  html += '</div></div>';

  html += '<div class="panel"><h2>Historique</h2>';
  if(total===0){
    html += '<p class="dim" style="font-size:12px;">Aucune partie enregistrée encore.</p>';
  } else {
    state.gameHistory.forEach(function(g){
      var w = g.winner==="civils" ? "Civils" : (g.winner==="white" ? "Mr. White" : "Infiltrés");
      html += '<div class="histrow"><div class="toprow"><span>'+w+'</span><span class="mono faint" style="font-size:11px;">'+new Date(g.date).toLocaleDateString("fr-FR")+'</span></div>';
      html += '<p class="dim" style="font-size:12px;">'+g.players.length+' joueurs · '+g.rounds+' round'+(g.rounds>1?"s":"")+' · mot : '+esc(g.wordPair.civil)+'</p></div>';
    });
  }
  html += '</div>';
  return html;
}

loadStorage();
render();
</script>
</body>
</html>
