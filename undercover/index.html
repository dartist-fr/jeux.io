<title>Undercover — Dossier d'enquête confidentiel</title>
<style>
  :root{
    /* Dossier noir — mode sombre */
    --bg:#131210; --panel:#1c1a16; --panel-alt:#262319;
    --ink:#eae3d2; --ink2:#d8cfb8; --dim:#a99a7a; --faint:#6f664f;
    --border:#3b3527; --red:#b1332c; --olive:#788634;
    --paper-line:rgba(255,255,255,0.015);
  }
  :root[data-theme="light"]{
    /* Chemise kraft — mode clair */
    --bg:#cdbf9c; --panel:#e6dcc0; --panel-alt:#dacda8;
    --ink:#241f17; --ink2:#352e20; --dim:#6a5f45; --faint:#8f8564;
    --border:#b3a578; --red:#9e2a24; --olive:#556021;
    --paper-line:rgba(0,0,0,0.025);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;color:var(--ink);
    background:
      repeating-linear-gradient(0deg, var(--paper-line) 0, var(--paper-line) 1px, transparent 1px, transparent 26px),
      var(--bg);
    font-family:Georgia,'Times New Roman',serif;
    -webkit-tap-highlight-color:transparent;
    height:100%;transition:background 0.15s,color 0.15s;}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .display{font-family:'Courier New',Courier,monospace;letter-spacing:0.06em;font-weight:700;text-transform:uppercase;}
  .mono{font-family:'Courier New',Courier,monospace;}
  #app{max-width:520px;margin:0 auto;padding:16px;min-height:100vh;}

  /* En-tête : bandeau de dossier classé */
  header{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;
    padding:14px 14px 16px;margin-bottom:20px;
    background:var(--panel);border:1px solid var(--border);border-left:5px solid var(--red);border-radius:4px;
    box-shadow:0 2px 0 rgba(0,0,0,0.15);}
  h1{font-size:20px;margin:0;color:var(--ink);}
  .subtitle{font-size:10px;color:var(--dim);font-family:'Courier New',monospace;margin-top:4px;letter-spacing:0.12em;text-transform:uppercase;}
  .casetag{display:inline-block;margin-top:8px;font-family:'Courier New',monospace;font-size:10px;letter-spacing:0.1em;
    color:var(--red);border:1px solid var(--red);border-radius:2px;padding:2px 6px;text-transform:uppercase;}
  .iconbtn{background:none;border:1px solid var(--border);color:var(--dim);font-size:16px;cursor:pointer;padding:4px 7px;border-radius:3px;}
  .iconbtn:active{color:var(--ink);background:var(--panel-alt);}
  .headerbtns{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .themebtn{display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--border);
    color:var(--dim);font-size:10px;cursor:pointer;padding:5px 9px;border-radius:3px;font-family:'Courier New',monospace;text-transform:uppercase;letter-spacing:0.06em;}
  .themebtn:active{background:var(--panel-alt);}

  /* Fiches du dossier */
  .panel{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:4px;
    padding:18px;margin-bottom:16px;box-shadow:0 1px 0 rgba(0,0,0,0.12);}
  .panel h2{position:relative;display:inline-block;font-size:12px;letter-spacing:0.12em;color:var(--ink2);
    margin:0 0 14px;font-family:'Courier New',monospace;text-transform:uppercase;padding-left:16px;}
  .panel h2::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:8px;height:8px;background:var(--red);border-radius:1px;}
  .row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;}
  .row span.label{font-size:15px;color:var(--dim);}
  .stepper{display:flex;align-items:center;gap:12px;}
  .stepper button{width:32px;height:32px;background:var(--bg);border:1px solid var(--border);color:var(--ink2);border-radius:3px;font-size:16px;cursor:pointer;font-family:'Courier New',monospace;}
  .stepper button:active{background:var(--panel-alt);}
  .stepper .val{width:22px;text-align:center;font-family:'Courier New',monospace;font-size:16px;}

  input[type=text],select{
    width:100%;background:var(--bg);border:1px solid var(--border);border-radius:3px;
    color:var(--ink);padding:10px 12px;font-size:15px;outline:none;font-family:'Courier New',monospace;
  }
  input[type=text]::placeholder{color:var(--faint);}
  input[type=text]:focus,select:focus{border-color:var(--red);}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 18px;font-size:13px;font-weight:700;letter-spacing:0.08em;
    text-transform:uppercase;border-radius:3px;cursor:pointer;width:100%;border:1px solid var(--border);
    font-family:'Courier New',monospace;}
  .btn-primary{background:var(--red);border-color:#000;color:#f5efe0;}
  .btn-primary:active{opacity:0.85;}
  .btn-primary:disabled{opacity:0.3;pointer-events:none;}
  .btn-ghost{background:none;border:1px solid var(--border);color:var(--ink2);}
  .btn-ghost:active{background:var(--panel-alt);}
  .btn-small{width:auto;padding:9px 14px;font-size:11px;}
  .linkbtn{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;text-decoration:underline;display:block;margin:0 auto;font-family:'Courier New',monospace;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .chip{display:flex;align-items:center;gap:6px;background:var(--panel-alt);border:1px dashed var(--border);
    border-radius:3px;padding:6px 10px;font-size:14px;font-family:'Courier New',monospace;}
  .chip button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:13px;padding:0;}
  .inline2{display:flex;gap:8px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .fieldlabel{font-size:10px;color:var(--dim);display:block;margin-bottom:5px;font-family:'Courier New',monospace;text-transform:uppercase;letter-spacing:0.08em;}
  .center{text-align:center;}
  .py-lg{padding:44px 18px;}

  /* Tampons de dossier */
  .stamp{display:inline-block;border:3px double var(--red);color:var(--red);
    padding:10px 22px;border-radius:4px;font-size:20px;text-transform:uppercase;
    transform:rotate(-3deg);font-family:'Courier New',monospace;font-weight:bold;letter-spacing:0.05em;
    box-shadow:inset 0 0 0 2px var(--panel);}
  .stamp.olive{border-color:var(--olive);color:var(--olive);}
  .stamp.neutral{border-color:var(--dim);color:var(--dim);}
  .stamp.sm{font-size:12px;padding:5px 12px;border-width:2px;}
  .stamp.md{font-size:14px;padding:7px 15px;border-width:2px;}

  .redacted{display:flex;gap:4px;justify-content:center;margin:18px 0;}
  .redacted div{height:10px;background:var(--ink);opacity:0.85;width:26px;border-radius:1px;}
  .wordbig{font-size:30px;color:var(--ink);font-family:'Courier New',monospace;margin-top:6px;letter-spacing:0.04em;}
  .dim{color:var(--dim);}
  .faint{color:var(--faint);}
  .mt6{margin-top:6px;}.mt10{margin-top:10px;}.mt16{margin-top:16px;}.mt24{margin-top:24px;}.mb10{margin-bottom:10px;}

  .voteitem{width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:13px 16px;border-radius:3px;border:1px solid var(--border);background:var(--bg);color:var(--ink);
    font-size:15px;text-align:left;cursor:pointer;margin-bottom:8px;font-family:'Courier New',monospace;}
  .voteitem.selected{border-color:var(--red);border-left:4px solid var(--red);background:var(--panel-alt);}

  .clueChip{font-size:12px;padding:5px 10px;border-radius:3px;border:1px solid var(--border);color:var(--dim);font-family:'Courier New',monospace;}
  .clueChip.current{border-color:var(--red);color:var(--ink);}
  .clueChip.done{color:var(--faint);text-decoration:line-through;}
  .flexwrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .split{display:flex;justify-content:space-around;text-align:center;}
  .split .num{font-size:22px;font-family:'Courier New',monospace;}
  .listrow{display:flex;align-items:center;justify-content:space-between;font-size:15px;padding:6px 0;border-bottom:1px dotted var(--border);}
  .listrow:last-child{border-bottom:none;}
  .strike{color:var(--faint);text-decoration:line-through;}
  .histrow{border-bottom:1px solid var(--panel-alt);padding-bottom:8px;margin-bottom:8px;}
  .histrow:last-child{border-bottom:none;}
  .warn{color:#e0827f;font-size:12px;margin-top:8px;font-family:'Courier New',monospace;}
  .toprow{display:flex;justify-content:space-between;align-items:center;}
  .libraryrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dotted var(--border);}
  .libraryrow:last-child{border-bottom:none;}
  .libwords{font-size:14px;flex:1;min-width:0;font-family:'Courier New',monospace;}
  .libcontrols{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .libSelect{width:auto;min-width:110px;padding:6px 8px;font-size:12px;}
  .libcontrols button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px;padding:2px;}
  .libcontrols button:active{color:var(--red);}
</style>
</head>

function migrateLibrary(){
  var currentVersion = "undercover_library_v4"; // Mise à jour pour charger la nouvelle liste de mots
  var stored = null;
  try{ var raw = localStorage.getItem(currentVersion); if(raw) stored = JSON.parse(raw); }catch(e){}
  if(stored && stored.length){ state.library = stored; return; }

  var customPairs = [];
  try{
    var oldKeys = ["undercover_library", "undercover_library_v2", "undercover_library_v3", "undercover_custom_pairs"];
    oldKeys.forEach(function(key){
      var oldRaw = localStorage.getItem(key);
      if(oldRaw){
        var parsed = JSON.parse(oldRaw);
        parsed.forEach(function(p){
          if(p.id && String(p.id).indexOf("c") === 0){
            var exists = customPairs.some(function(cp){ return cp.civil === p.civil && cp.undercover === p.undercover; });
            if(!exists) customPairs.push(p);
          }
        });
      }
    });
  }catch(e){}

  var lib = BUILTIN_PAIRS.map(function(p,i){ return { id:"b"+i, theme:p.theme, difficulty:p.difficulty, civil:p.civil, undercover:p.undercover }; });
  customPairs.forEach(function(p){ lib.push(p); });
  state.library = lib;
  saveLibrary();
}

function saveLibrary(){ try{ localStorage.setItem("undercover_library_v4", JSON.stringify(state.library)); }catch(e){} }

function loadStorage(){
  migrateLibrary();
  try{ var gh = localStorage.getItem("undercover_game_history"); if(gh) state.gameHistory = JSON.parse(gh); }catch(e){}
  try{ var tm = localStorage.getItem("undercover_theme"); if(tm==="light"||tm==="dark") state.themeMode = tm; }catch(e){}
  applyTheme();
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", state.themeMode);
}
function toggleTheme(){
  state.themeMode = state.themeMode==="dark" ? "light" : "dark";
  try{ localStorage.setItem("undercover_theme", state.themeMode); }catch(e){}
  applyTheme();
  render();
}
function toggleFullscreen(){
  var isFs = document.fullscreenElement || document.webkitFullscreenElement;
  if(!isFs){
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(req){ try{ req.call(el); }catch(e){} }
  } else {
    var exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if(exit){ try{ exit.call(document); }catch(e){} }
  }
}
document.addEventListener("fullscreenchange", function(){ render(); });
document.addEventListener("webkitfullscreenchange", function(){ render(); });
function saveGameHistory(){ try{ localStorage.setItem("undercover_game_history", JSON.stringify(state.gameHistory.slice(0,30))); }catch(e){} }

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function allPairs(){ return state.library; }
function themesList(){
  var set = {}; allPairs().forEach(function(p){ set[p.theme]=true; });
  return ["Aléatoire"].concat(Object.keys(set).sort());
}

function changeUndercover(delta){

function changeWhite(delta){

function startGame(){
  var pair = null;

  if(state.isGameMaster){
    var gmCiv = document.getElementById("gmCivil");
    var gmUnd = document.getElementById("gmUndercover");
    if(gmCiv) state.customCivil = gmCiv.value.trim();
    if(gmUnd) state.customUndercover = gmUnd.value.trim();

    if(!state.customCivil || !state.customUndercover){
      alert("Veuillez renseigner les deux mots pour le mode Meneur d'enquête.");
      return;
    }
    pair = { theme:"Personnalisé", difficulty:"Custom", civil:state.customCivil, undercover:state.customUndercover };
  } else {
    var themeSel = document.getElementById("themeSel");
    var diffSel = document.getElementById("diffSel");
    if(themeSel) state.theme = themeSel.value;
    if(diffSel) state.difficulty = diffSel.value;

    var pool = allPairs();
    if(state.theme !== "Aléatoire") pool = pool.filter(function(p){return p.theme===state.theme;});
    if(state.difficulty !== "Aléatoire") pool = pool.filter(function(p){return p.difficulty===state.difficulty;});
    if(pool.length===0) pool = allPairs();
    pair = pool[Math.floor(Math.random()*pool.length)];
  }

  var order = shuffle(state.playerNames.map(function(_,i){return i;}));
  var players = state.playerNames.map(function(name,idx){
    return { id:idx, name:name, role:"civil", word:pair.civil, alive:true };
  });
  order.slice(0,state.numUndercover).forEach(function(idx){ players[idx].role="undercover"; players[idx].word=pair.undercover; });
  order.slice(state.numUndercover, state.numUndercover+state.numWhite).forEach(function(idx){ players[idx].role="white"; players[idx].word=null; });

  state.players = players;
  state.wordPair = pair;
  state.revealIndex = 0;
  state.revealed = false;
  state.round = 1;
  state.eliminations = [];
  state.winner = null;
  state.clueOrder = shuffle(players.map(function(p){return p.id;}));
  state.clueTurn = 0;
  state.screen = "reveal";
  render();
}

function revealCard(){ state.revealed = true; render(); }
function nextReveal(){
  if(state.revealIndex+1 >= state.players.length){ state.screen="clues"; }
  else { state.revealIndex++; state.revealed=false; }
  render();
}

function aliveClueOrder(){
  return state.clueOrder.filter(function(id){
    var p = state.players.find(function(pl){return pl.id===id;});
    return p && p.alive;
  });
}
function nextClueTurn(){
  var order = aliveClueOrder();
  if(state.clueTurn+1 >= order.length){ state.screen="vote"; state.selectedVote=null; }
  else { state.clueTurn++; }
  render();
}
function goToVote(){ state.screen="vote"; state.selectedVote=null; render(); }
function selectVote(id){ state.selectedVote = id; render(); }

function confirmVote(){
  if(state.selectedVote==null) return;
  var target = state.players.find(function(p){return p.id===state.selectedVote;});
  state.justEliminated = target;
  target.alive = false;
  state.eliminations.push({ round:state.round, playerId:target.id, name:target.name, role:target.role });
  if(target.role==="white"){
    state.screen="whiteGuess";
  } else {
    state.screen="eliminationReveal";
  }
  render();
}

function submitWhiteGuess(){
  var input = document.getElementById("whiteGuessInput");
  var guess = (input ? input.value : "").trim();
  var correct = guess.length>0 && guess.toLowerCase()===state.wordPair.civil.trim().toLowerCase();
  var last = state.eliminations[state.eliminations.length-1];
  last.whiteGuess = guess;
  last.whiteCorrect = correct;
  if(correct){ finishGame("white"); }
  else { state.screen="eliminationReveal"; render(); }
}

function checkWinCondition(){
  var alive = state.players.filter(function(p){return p.alive;});
  var aliveInf = alive.filter(function(p){return p.role!=="civil";}).length;
  var aliveCiv = alive.filter(function(p){return p.role==="civil";}).length;
  if(aliveInf===0) return "civils";
  if(aliveInf>=aliveCiv) return "infiltrators";
  return null;
}
function proceedAfterElimination(){
  var result = checkWinCondition();
  if(result){ finishGame(result); return; }
  state.round++;
  var aliveIds = state.players.filter(function(p){return p.alive;}).map(function(p){return p.id;});
  state.clueOrder = shuffle(aliveIds);
  state.clueTurn = 0;
  state.screen = "clues";
  render();
}

function finishGame(winnerKey){
  state.winner = winnerKey;
  state.screen = "end";
  state.gameHistory.unshift({
    date:new Date().toISOString(),
    winner:winnerKey,
    players: state.players.map(function(p){return {name:p.name, role:p.role};}),
    rounds: state.round,
    wordPair: state.wordPair,
    eliminations: state.eliminations
  });
  saveGameHistory();
  render();
}

  else if(state.screen==="eliminationReveal"){ html += renderEliminationReveal(); }
  else if(state.screen==="end"){ html += renderEnd(); }

  var html = '<div class="toprow"><div class="stamp sm">Manche '+state.round+'</div><span class="mono dim" style="font-size:12px;">'+(state.clueTurn+1)+' / '+order.length+'</span></div>';
  html += '<div class="panel center py-lg" style="margin-top:16px;">';
  html += '<p class="dim" style="font-size:14px;">Déposition de</p>';
  html += '<p class="display" style="font-size:24px;margin:4px 0;">'+esc(current.name)+'</p>';
  html += '<p class="dim" style="font-size:12px;margin-bottom:20px;">livrez votre indice à voix haute</p>';
  html += '<button class="btn btn-primary" style="width:auto;padding:13px 22px;" onclick="nextClueTurn()">Indice consigné &#8250;</button>';
  html += '</div>';
  html += '<div class="flexwrap">';
  order.forEach(function(id,i){
    var p = state.players.find(function(pl){return pl.id===id;});
    var cls = i<state.clueTurn ? "clueChip done" : (i===state.clueTurn ? "clueChip current" : "clueChip");
    html += '<span class="'+cls+'">'+esc(p.name)+'</span>';
  });
  html += '</div>';
  html += '<button class="linkbtn mt16" onclick="goToVote()">Passer directement à l\'interrogatoire</button>';
  return html;
}

function renderVote(){
  var alive = state.players.filter(function(p){return p.alive;});
  var html = '<div class="stamp sm">Manche '+state.round+' — Interrogatoire</div>';
  html += '<p class="dim mt10" style="font-size:14px;">Les suspects ont débattu et voté à l\'oral. Désignez le suspect mis en accusation.</p>';
  html += '<div class="mt16">';
  alive.forEach(function(p){
    var sel = state.selectedVote===p.id;
    html += '<button class="voteitem'+(sel?" selected":"")+'" onclick="selectVote('+p.id+')"><span>'+esc(p.name)+'</span>'+(sel?'<span>&#10003;</span>':'')+'</button>';
  });
  html += '</div>';
  html += '<button class="btn btn-primary" '+(state.selectedVote==null?"disabled":"")+' onclick="confirmVote()">&#128128; Confirmer l\'inculpation</button>';
  return html;
}

function renderWhiteGuess(){
  var p = state.justEliminated;
  var html = '<div class="panel center py-lg">';
  html += '<div class="stamp md">Mr. White démasqué</div>';
  html += '<p class="mt16" style="font-size:15px;">'+esc(p.name)+', dernière chance :</p>';
  html += '<p class="dim mb10" style="font-size:13px;">devinez le mot des civils pour renverser l\'enquête</p>';
  html += '<input type="text" id="whiteGuessInput" placeholder="Votre déposition" style="text-align:center;">';
  html += '<button class="btn btn-primary mt16" onclick="submitWhiteGuess()">Valider la déposition</button>';
  html += '</div>';
  return html;
}

function renderEliminationReveal(){
  var p = state.justEliminated;
  var last = state.eliminations[state.eliminations.length-1];
  var aliveCiv = state.players.filter(function(pl){return pl.alive && pl.role==="civil";}).length;
  var aliveInf = state.players.filter(function(pl){return pl.alive && pl.role!=="civil";}).length;
  var cls = p.role==="civil" ? "stamp olive" : "stamp";
  var html = '<div class="panel center py-lg">';
  html += '<p class="dim" style="font-size:14px;">'+esc(p.name)+' était</p>';
  
  html += '<div class="'+cls+'">'+ROLE_LABEL[p.role]+'</div>';
  
  if(last && last.whiteGuess){
    html += '<p class="dim mt16" style="font-size:13px;">A déposé « '+esc(last.whiteGuess)+' » — '+(last.whiteCorrect?"correct":"incorrect")+'</p>';
  }
  html += '<p class="mono faint mt16" style="font-size:11px;">Encore en liberté : '+aliveCiv+' civil'+(aliveCiv>1?"s":"")+', '+aliveInf+' infiltré'+(aliveInf>1?"s":"")+'</p>';
  html += '<button class="btn btn-ghost mt16" style="width:auto;padding:11px 20px;" onclick="proceedAfterElimination()">Poursuivre l\'enquête</button>';
  html += '</div>';
  return html;
}

function renderEnd(){
  var label = state.winner==="civils" ? "Les Civils gagnent" : (state.winner==="white" ? "Mr. White gagne" : "Les Infiltrés gagnent");
  var cls = state.winner==="civils" ? "stamp olive" : "stamp";
  var html = '<div class="panel center py-lg">';
  html += '<div class="'+cls+'">'+label+'</div>';
  html += '<p class="mono dim mt16" style="font-size:12px;">Affaire classée en '+state.round+' manche'+(state.round>1?"s":"")+'</p>';
  html += '</div>';

  html += '<div class="panel"><h2>Pièces à conviction</h2><div class="split">';
  html += '<div><p class="dim" style="font-size:12px;">Civils</p><p class="num">'+esc(state.wordPair.civil)+'</p></div>';
  html += '<div><p class="dim" style="font-size:12px;">Undercover</p><p class="num">'+esc(state.wordPair.undercover)+'</p></div>';
  html += '</div></div>';

  html += '<div class="panel"><h2>Rapport final</h2>';
  state.players.forEach(function(p){
    html += '<div class="listrow"><span class="'+(p.alive?"":"strike")+'">'+esc(p.name)+'</span><span class="mono dim" style="font-size:12px;">'+ROLE_LABEL[p.role]+'</span></div>';
  });
  if(state.eliminations.length>0){
    html += '<div style="border-top:1px solid var(--border);margin-top:10px;padding-top:8px;">';
    state.eliminations.forEach(function(e){
      html += '<p class="dim" style="font-size:12px;margin:4px 0;">Manche '+e.round+' — '+esc(e.name)+' inculpé ('+ROLE_LABEL[e.role]+')</p>';
    });
    html += '</div>';
  }
  html += '</div>';

  html += '<button class="btn btn-primary" onclick="newGameSamePlayers()">&#8635; Nouvelle affaire</button>';
  return html;
}

function renderLibrary(){
  var html = '<button class="linkbtn" style="text-align:left;margin:0 0 14px;" onclick="closeLibrary()">&#8249; Retour au dossier</button>';
  html += '<div class="panel"><h2>Nouvel indice</h2>';
  html += '<div class="grid2"><input type="text" id="wmCivil" placeholder="Mot civil"><input type="text" id="wmUndercover" placeholder="Mot undercover"></div>';
  html += '<div class="grid2"><input type="text" id="wmTheme" placeholder="Dossier (existant ou nouveau)"><select id="wmDiff"><option value="facile">facile</option><option value="moyen" selected>moyen</option><option value="difficile">difficile</option></select></div>';
  html += '<button class="btn btn-ghost" onclick="addLibraryPair()">+ Classer dans les archives</button></div>';

  var groups = {};
  state.library.forEach(function(p){ (groups[p.theme]=groups[p.theme]||[]).push(p); });
  var themeNames = Object.keys(groups).sort();

  html += '<div class="panel"><h2>Archives ('+state.library.length+' indices)</h2>';
  themeNames.forEach(function(t){
    html += '<p class="mono dim" style="font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin:14px 0 6px;">'+esc(t)+' ('+groups[t].length+')</p>';
    groups[t].forEach(function(p){
      var opts = themeNames.map(function(tn){ return '<option value="'+esc(tn)+'"'+(tn===p.theme?" selected":"")+'>'+esc(tn)+'</option>'; }).join("");
      html += '<div class="libraryrow">';
      html += '<div class="libwords"><span>'+esc(p.civil)+'</span><span class="dim"> / </span><span>'+esc(p.undercover)+'</span><span class="mono faint" style="font-size:10px;display:block;">'+p.difficulty+'</span></div>';
      html += '<div class="libcontrols"><select class="libSelect" onchange="moveLibraryPair(\''+p.id+'\', this.value)">'+opts+'</select><button onclick="deleteLibraryPair(\''+p.id+'\')" aria-label="Supprimer">&#128465;</button></div>';
      html += '</div>';
    });
  });
  html += '</div>';
  return html;
}

function renderStats(){
  var total = state.gameHistory.length;
  var civilWins = state.gameHistory.filter(function(g){return g.winner==="civils";}).length;
  var infWins = total - civilWins;
  var html = '<button class="linkbtn" style="text-align:left;margin:0 0 14px;" onclick="closeStats()">&#8249; Retour au dossier</button>';
  html += '<div class="panel"><h2>Bilan des affaires</h2><div class="split">';
  html += '<div><p class="num">'+total+'</p><p class="dim" style="font-size:12px;">affaires</p></div>';
  html += '<div><p class="num">'+civilWins+'</p><p class="dim" style="font-size:12px;">civils</p></div>';
  html += '<div><p class="num">'+infWins+'</p><p class="dim" style="font-size:12px;">infiltrés</p></div>';
  html += '</div></div>';

  html += '<div class="panel"><h2>Registre des affaires</h2>';
  if(total===0){
    html += '<p class="dim" style="font-size:12px;">Aucune affaire archivée pour le moment.</p>';
  } else {
    state.gameHistory.forEach(function(g){
      var w = g.winner==="civils" ? "Civils" : (g.winner==="white" ? "Mr. White" : "Infiltrés");
      html += '<div class="histrow"><div class="toprow"><span>'+w+'</span><span class="mono faint" style="font-size:11px;">'+new Date(g.date).toLocaleDateString("fr-FR")+'</span></div>';
      html += '<p class="dim" style="font-size:12px;">'+g.players.length+' suspects &middot; '+g.rounds+' manche'+(g.rounds>1?"s":"")+' &middot; indice : '+esc(g.wordPair.civil)+'</p></div>';
    });
  }
  html += '</div>';
  return html;
}

loadStorage();
render();
</script>
</body>
</html>
