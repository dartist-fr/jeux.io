<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Catalogue de Jeux</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #0f172a; color: #f8fafc; padding: 40px 20px; }
        h1 { color: #38bdf8; font-size: 2.5rem; margin-bottom: 10px; }
        .description { color: #94a3b8; margin-bottom: 40px; }
        .grid-jeux { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; max-width: 1000px; margin: 0 auto; }
        .carte-jeu { background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 25px; width: 260px; text-decoration: none; color: inherit; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; }
        .carte-jeu:hover { border-color: #38bdf8; transform: translateY(-5px); box-shadow: 0 10px 20px rgba(56, 189, 248, 0.15); }
        .icone { font-size: 3rem; margin-bottom: 15px; }
        .titre-jeu { font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; color: #f1f5f9; }
        .info-jeu { font-size: 0.9rem; color: #94a3b8; text-align: center; }
    </style>
</head>
<body>

    <h1>🎮 Salle d'Arcade de Damien</h1>
    <p class="description">Choisissez un jeu dans la liste ci-dessous pour commencer à jouer :</p>

    <div class="grid-jeux">
        
        <!-- CARTE DU JEU UNDERCOVER -->
        <a href="undercover/" class="carte-jeu">
            <div class="icone">🕵️‍♂️</div>
            <div class="titre-jeu">Undercover</div>
            <div class="info-jeu">Un jeu d'ambiance, de suspicion et de mots secrets. Trouvez l'intrus !</div>
        </a>

        <!-- CARTE DE VOTRE FUTUR DEUXIÈME JEU -->
        <a href="#" class="carte-jeu" style="opacity: 0.5; cursor: not-allowed;">
            <div class="icone">⏳</div>
            <div class="titre-jeu">Prochain Jeu</div>
            <div class="info-jeu">En cours de développement... Restez connectés !</div>
        </a>

    </div>

</body>
</html>
